name: Build native installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.0)
        required: false
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.17
      - run: python -m unittest discover -s tests -v
      - run: ruff check wifi_agent.py install.py packaging/generate_assets.py tests/test_wifi_agent.py

  windows:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $Version = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($Version) -and "${{ github.ref_type }}" -eq "tag") {
            $Version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($Version)) {
            $Version = (python -c "import wifi_agent; print(wifi_agent.APP_VERSION)").Trim()
          }
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Configure Windows signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw "Published installers require the Windows signing certificate and password secrets."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            $CertificatePath = Join-Path $env:RUNNER_TEMP "wifi-agent-signing.pfx"
            [IO.File]::WriteAllBytes($CertificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            "WINDOWS_SIGNING_CERTIFICATE=$CertificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
            "WINDOWS_SIGNING_PASSWORD=$env:CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: WiFiAgent-Windows-x64
          path: build/windows/installer/*.exe
          if-no-files-found: error

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          if [[ -z "$VERSION" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="$(python -c 'import wifi_agent; print(wifi_agent.APP_VERSION)')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Verify macOS GUI build support
        run: python -c 'import tkinter; print("Tcl/Tk", tkinter.Tcl().eval("info patch"))'
      - name: Configure Apple signing and notarization
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_SIGNING_IDENTITY: ${{ secrets.MACOS_APP_SIGNING_IDENTITY }}
          INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          for required in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APP_SIGNING_IDENTITY INSTALLER_SIGNING_IDENTITY NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID; do
            if [[ -z "${!required}" ]]; then
              echo "Published installers require the $required signing secret." >&2
              exit 1
            fi
          done
          if [[ -n "$CERTIFICATE_BASE64" ]]; then
            CERTIFICATE_PATH="$RUNNER_TEMP/wifi-agent-signing.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/wifi-agent-build.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            echo "MACOS_APP_SIGNING_IDENTITY=$APP_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "MACOS_INSTALLER_SIGNING_IDENTITY=$INSTALLER_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi
          if [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_PASSWORD" && -n "$NOTARY_TEAM_ID" ]]; then
            xcrun notarytool store-credentials wifi-agent-ci \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$NOTARY_TEAM_ID"
            echo "APPLE_NOTARY_KEYCHAIN_PROFILE=wifi-agent-ci" >> "$GITHUB_ENV"
          fi
      - name: Build macOS installers
        run: ./packaging/macos/build-installer.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: WiFiAgent-macOS-${{ matrix.architecture }}
          path: |
            build/macos/installer/*.pkg
            build/macos/installer/*.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_TITLE="WiFi Agent ${GITHUB_REF_NAME#v}"
            CREATE_ARGUMENTS=(--verify-tag --generate-notes)
          else
            VERSION="$REQUESTED_VERSION"
            RELEASE_TAG="installer-build-${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="WiFi Agent $VERSION installers (build ${GITHUB_RUN_NUMBER})"
            CREATE_ARGUMENTS=(--target "$GITHUB_SHA" --prerelease --notes "Direct installer downloads from workflow run ${GITHUB_RUN_NUMBER}.")
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TITLE" "${CREATE_ARGUMENTS[@]}"
          fi

          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          echo "### Direct installer downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "Installers are attached individually at [$RELEASE_TITLE]($RELEASE_URL); no ZIP extraction is required." >> "$GITHUB_STEP_SUMMARY"
